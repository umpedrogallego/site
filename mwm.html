<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="https://srv881-files.hstgr.io/73569734360acf18/files/public_html/check/ScreenSaver.ico">
  <title>★</title>

  <link rel="icon" type="image/x-icon" href="https://check/ScreenSaver.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Mude as cores aqui facilmente */
      --bg-dark: oklch(0.1513 0.0402 194.77);
      --text-main: oklch(0.8269 0.096 18.25 / 100%);
      --text-title: oklch(0.8269 0.096 18.25 / 88%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      width: 100%; height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Familjen Grotesk', sans-serif;
      overflow: hidden;
      cursor: none;
    }

    body.modo-manual { cursor: auto; }

    /* Cortina de Transição */
    #blackout {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #000; /* Dinâmico via JS */
      z-index: 9999; opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out, background-color 0.5s ease;
    }
    #blackout.ativo { opacity: 1; pointer-events: all; }

    /* Vídeo BG Fixo (Fica por trás de tudo) */
    #bg-video-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
    }
    #bg-video-container video {
      width: 100%; height: 100%; object-fit: cover; opacity: 0.5;
    }

    /* Tela Inicial com GALLEGO */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
      z-index: 10;
    }
    #start-overlay h1 {
      color: var(--text-title); font-weight: 500; font-size: clamp(3rem, 5vw, 6rem);
      width: 60vw; text-align: center; margin-bottom: 10vh;
      letter-spacing: 0.1em; cursor: pointer;
    }

    /* Grid Textual (Scroll Snap Vertical) */
    #grid-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg-dark); z-index: 20;
      display: none; flex-direction: column;
      overflow-y: auto; scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #grid-screen::-webkit-scrollbar { display: none; }
    
    .grid-item {
      display: flex; justify-content: space-between; align-items: center;
      min-height: 33.33vh; /* 3 itens por tela aprox */
      padding: 0 10vw; scroll-snap-align: center; cursor: pointer;
      font-size: clamp(2rem, 4vw, 4rem); transition: color 0.3s;
    }
    .grid-item:hover { color: #fff; }
    .grid-ano { font-weight: 400; opacity: 0.7; }
    .grid-titulo { font-weight: 600; text-align: right; color: var(--text-title); }

    /* Exibição */
    #exhibition-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: none; z-index: 5; background: transparent;
      justify-content: center; align-items: center;
    }
    
    #media-container {
      position: relative; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
    }
    iframe, video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

    /* Capa Mágica do Modo Manual (Protege o Foco) */
    #magic-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; cursor: pointer; display: none;
    }
    body.modo-manual #magic-overlay { display: block; }

    /* Galeria Scroll Horizontal */
    #gallery-container {
      display: flex; height: 100%; width: 100%; overflow-x: auto;
      scroll-snap-type: x mandatory; gap: 24px; padding: 0 24px;
      align-items: center; scrollbar-width: none;
    }
    #gallery-container::-webkit-scrollbar { display: none; }
    #gallery-container img { height: 100%; object-fit: contain; scroll-snap-align: center; }

    /* Rodapé Invisível */
    #footer-nav {
      position: absolute; bottom: -100px; left: 0; width: 100%;
      padding: 1.5rem; background: linear-gradient(to top, var(--bg-dark) 0%, transparent 100%);
      z-index: 50; display: flex; justify-content: space-between;
      transition: bottom 0.3s ease; font-weight: 300;
    }
    #footer-nav.visivel { bottom: 0; }
  </style>
</head>
<body>

  <div id="blackout"></div>

  <!-- BG Fixo -->
  <div id="bg-video-container">
    <video src="https://umpedrogallego.github.io/site/midia/6x1-bg.webm" muted autoplay playsinline loop></video>
  </div>

  <!-- Tela Inicial -->
  <div id="start-overlay">
    <h1 id="btn-iniciar">GALLEGO</h1>
  </div>

  <!-- Tela Grid Textual -->
  <div id="grid-screen"></div>

  <!-- Tela Exibição -->
  <div id="exhibition-screen">
    <div id="media-container">
      <!-- Injetado via JS -->
      <div id="magic-overlay"></div> 
    </div>
  </div>

  <!-- Rodapé -->
  <div id="footer-nav">
    <span id="footer-title">Obra</span>
    <span id="footer-status">SEAMLESS</span>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="config.js"></script>

  <script>
    let ytPlayer = null;
    let obraAtiva = null;
    let indexAtual = 0;
    let timeChecker = null;
    let currentSegment = 0;
    
    let modoManual = false;
    let modoEspera = false;
    let galeriaIndex = 0;
    let useVideoBgForFade = false; // Tecla Y

    const dom = {
      blackout: document.getElementById('blackout'),
      startOverlay: document.getElementById('start-overlay'),
      gridScreen: document.getElementById('grid-screen'),
      exhibitionScreen: document.getElementById('exhibition-screen'),
      mediaContainer: document.getElementById('media-container'),
      magicOverlay: document.getElementById('magic-overlay'),
      btnIniciar: document.getElementById('btn-iniciar')
    };

    // --- GRID INFINITO (Texto) ---
    function montarGrid() {
      if (typeof APRESENTACAO === 'undefined') return;
      
      const criarItens = () => {
        APRESENTACAO.forEach((obra, index) => {
          const item = document.createElement('div');
          item.className = 'grid-item';
          item.innerHTML = `<span class="grid-ano">${obra.ano}</span> <span class="grid-titulo">${obra.titulo}</span>`;
          item.onclick = () => {
            indexAtual = index;
            carregarObra();
          };
          dom.gridScreen.appendChild(item);
        });
      };
      
      // Repete 3 vezes para simular scroll infinito
      criarItens(); criarItens(); criarItens();
    }

    // --- INÍCIO ---
    dom.btnIniciar.addEventListener('click', () => {
      // Pede Fullscreen
      if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      
      dom.startOverlay.style.display = 'none';
      indexAtual = 0;
      carregarObra();
    });

    // --- TRANSIÇÕES ---
    function atualizarCorFade() {
      if (useVideoBgForFade) {
        dom.blackout.style.backgroundColor = 'transparent';
      } else {
        dom.blackout.style.backgroundColor = obraAtiva?.fadeColor || '#000000';
      }
    }

    function entrarEmEspera() {
      modoEspera = true;
      atualizarCorFade();
      dom.blackout.classList.add('ativo');
      // Limpa player por trás da cortina
      setTimeout(limparMedia, 600);
    }

    function carregarObra() {
      if (indexAtual >= APRESENTACAO.length) indexAtual = 0; // Loop na apresentação geral
      obraAtiva = APRESENTACAO[indexAtual];
      modoEspera = false;
      
      document.getElementById('footer-title').innerText = `${obraAtiva.titulo} (${obraAtiva.ano})`;
      
      // Cor transitória neutra (Preto) para entrar na obra
      dom.blackout.style.backgroundColor = '#000';
      dom.blackout.classList.add('ativo');
      
      setTimeout(() => {
        dom.gridScreen.style.display = 'none';
        dom.exhibitionScreen.style.display = 'flex';
        limparMedia();

        if (obraAtiva.provedor === 'youtube') carregarYouTube(obraAtiva);
        else if (obraAtiva.tipo.includes('galeria')) carregarGaleria(obraAtiva);
        else if (obraAtiva.tipo === 'video-nativo') carregarVideoLocal(obraAtiva);

        // O fadeout acontece via eventos do YT ou direto para local/galeria
        if (obraAtiva.provedor !== 'youtube') {
          setTimeout(() => dom.blackout.classList.remove('ativo'), 500);
        }
      }, 600);
    }

    function limparMedia() {
      if (timeChecker) clearInterval(timeChecker);
      if (ytPlayer && ytPlayer.destroy) ytPlayer.destroy();
      
      // Remove tudo exceto o magic-overlay
      Array.from(dom.mediaContainer.children).forEach(child => {
        if(child.id !== 'magic-overlay') child.remove();
      });
      ytPlayer = null;
    }

    // --- YOUTUBE LOGIC ---
    function carregarYouTube(obra) {
      const div = document.createElement('div');
      div.id = 'yt-player-div';
      dom.mediaContainer.insertBefore(div, dom.magicOverlay);
      currentSegment = 0;
      
      let startSeconds = obra.tipo === 'video-sequenciado' ? obra.segmentos[0].start : obra.inicio;

      ytPlayer = new YT.Player('yt-player-div', {
        videoId: obra.videoId,
        playerVars: {
          controls: 0, disablekb: 1, modestbranding: 1, rel: 0, showinfo: 0, fs: 0,
          cc_load_policy: obra.desabilitarLegenda ? 0 : 1, start: startSeconds
        },
        events: {
          'onReady': (e) => {
            e.target.setPlaybackQuality(obra.qualidade || 'hd1080');
            e.target.playVideo();
          },
          'onStateChange': (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              dom.blackout.classList.remove('ativo'); // Revela quando engatar o play
              if (!modoManual) {
                timeChecker = setInterval(obra.tipo === 'video-sequenciado' ? checarSaltosYT : checarFimYT, 100);
              }
            } else if (event.data === YT.PlayerState.ENDED) {
              entrarEmEspera();
            }
          }
        }
      });
    }

    function checarSaltosYT() {
      if (!ytPlayer || !ytPlayer.getCurrentTime) return;
      const currentTime = ytPlayer.getCurrentTime();
      const targetEnd = obraAtiva.segmentos[currentSegment].end;

      // 1 Segundo ANTES, sobe o blackout
      if (targetEnd - currentTime <= 1.0 && !dom.blackout.classList.contains('ativo')) {
        dom.blackout.style.backgroundColor = '#000';
        dom.blackout.classList.add('ativo');
      }

      if (currentTime >= targetEnd) {
        clearInterval(timeChecker);
        currentSegment++;
        
        if (currentSegment < obraAtiva.segmentos.length) {
          ytPlayer.pauseVideo();
          // Espera 5s no preto absoluto
          setTimeout(() => {
            ytPlayer.seekTo(obraAtiva.segmentos[currentSegment].start, true);
            ytPlayer.playVideo();
            // O evento onStateChange PLAYING vai tirar o blackout automaticamente
          }, 5000);
        } else {
          entrarEmEspera();
        }
      }
    }

    function checarFimYT() {
      if (!ytPlayer || !ytPlayer.getDuration) return;
      if (ytPlayer.getDuration() - ytPlayer.getCurrentTime() <= 1.0) {
        if(!dom.blackout.classList.contains('ativo')) entrarEmEspera();
      }
    }

    // --- LOCAL / GALERIA ---
    function carregarVideoLocal(obra) {
      const vid = document.createElement('video');
      vid.src = obra.src; vid.controls = false; vid.autoplay = true;
      vid.onended = entrarEmEspera;
      dom.mediaContainer.insertBefore(vid, dom.magicOverlay);
    }

    function carregarGaleria(obra) {
      const galeria = document.createElement('div');
      galeria.id = 'gallery-container';
      galeriaIndex = 0;
      obra.imagens.forEach(src => {
        const img = document.createElement('img'); img.src = src;
        galeria.appendChild(img);
      });
      dom.mediaContainer.insertBefore(galeria, dom.magicOverlay);
    }

    // --- CONTROLE MÁGICO (Clique Falso) ---
    dom.magicOverlay.addEventListener('click', () => {
      if (obraAtiva?.provedor === 'youtube' && ytPlayer) {
        ytPlayer.getPlayerState() === 1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
      } else {
        const vid = dom.mediaContainer.querySelector('video');
        if (vid) vid.paused ? vid.play() : vid.pause();
      }
    });

    // --- ATALHOS DE TECLADO ---
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey) return;

      switch(e.key) {
        case '\\': 
          document.getElementById('footer-nav').classList.toggle('visivel'); 
          break;

        case 'y':
        case 'Y':
          useVideoBgForFade = !useVideoBgForFade;
          if (modoEspera) atualizarCorFade(); // Aplica imediato se estiver esperando
          break;

        case 'b':
        case 'B':
          modoManual = !modoManual;
          document.body.classList.toggle('modo-manual', modoManual);
          document.getElementById('footer-status').innerText = modoManual ? "MANUAL" : "SEAMLESS";
          
          if (!modoManual && ytPlayer && ytPlayer.getPlayerState() === 1) {
            clearInterval(timeChecker);
            timeChecker = setInterval(obraAtiva?.tipo === 'video-sequenciado' ? checarSaltosYT : checarFimYT, 100);
          }
          break;

        case 'g':
        case 'G':
          dom.blackout.style.backgroundColor = '#000';
          dom.blackout.classList.add('ativo');
          setTimeout(() => {
            limparMedia(); modoEspera = false;
            dom.startOverlay.style.display = 'none';
            dom.exhibitionScreen.style.display = 'none';
            dom.gridScreen.style.display = 'flex';
            setTimeout(() => dom.blackout.classList.remove('ativo'), 500);
          }, 600);
          break;

        case ' ': // Espaço (só funciona se não estiver no Grid)
          if (dom.gridScreen.style.display === 'flex') return;
          e.preventDefault(); 
          dom.magicOverlay.click(); // Reutiliza a lógica do clique falso
          break;

        case 'ArrowRight':
        case 'ArrowLeft':
          const dir = e.key === 'ArrowRight' ? 1 : -1;
          
          if (modoEspera) {
            // Avança para próxima obra (Só seta direita avança natural, esquerda recua)
            indexAtual = Math.max(0, Math.min(indexAtual + dir, APRESENTACAO.length - 1));
            carregarObra();
          } 
          else if (obraAtiva?.tipo.includes('galeria')) {
            const galeria = document.getElementById('gallery-container');
            if (galeria) {
              const imgs = galeria.querySelectorAll('img');
              galeriaIndex = Math.max(0, Math.min(galeriaIndex + dir, imgs.length - 1));
              imgs[galeriaIndex].scrollIntoView({ behavior: 'smooth', inline: 'center' });
            }
          } 
          else if (modoManual) {
            if (obraAtiva?.provedor === 'youtube' && ytPlayer) {
              ytPlayer.seekTo(ytPlayer.getCurrentTime() + (5 * dir), true);
            } else {
              const vid = dom.mediaContainer.querySelector('video');
              if (vid) vid.currentTime += (5 * dir);
            }
          }
          break;
      }
    });

    window.addEventListener('load', montarGrid);
  </script>
</body>
</html>
