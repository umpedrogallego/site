<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Sequencer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #2b2424;
      --bg-darker: #002424;
      --text-light: #bebab0;
      --accent: #e2ff8f;
      --border-color: #505a50;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Tela inicial com botão discreto */
    #start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    button {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border-color);
      padding: 1rem 2rem;
      font-family: inherit;
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent);
      color: var(--bg-dark);
    }

    /* Container do Vídeo */
    #video-wrapper {
      display: none; /* Escondido até o clique */
      width: 100%;
      height: 100%;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      pointer-events: none; /* Impede o usuário de pausar clicando na tela */
    }

    /* Placeholder Passo 2 */
    #step-two {
      display: none;
      width: 100%;
      height: 100%;
      background-color: var(--bg-darker);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: normal;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- 1. Tela Inicial -->
  <div id="start-screen">
    <button id="play-btn">Iniciar Sessão [▶]</button>
  </div>

  <!-- 2. Tela de Vídeo -->
  <div id="video-wrapper">
    <div id="player"></div>
  </div>

  <!-- 3. Próximo Conteúdo (Placeholder) -->
  <div id="step-two">
    <h1>VÍDEO 02 AQUI</h1>
    <p>A sequência 1 foi concluída.</p>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let timeChecker;
    let currentSegment = 0;

    // Tempos convertidos para segundos
    // 1. 00:07 - 00:20 (7s a 20s)
    // 2. 03:50 - 06:31 (230s a 391s)
    // 3. 24:45 - 27:00 (1485s a 1620s)
    const segments = [
      { start: 7, end: 20 },
      { start: 230, end: 391 },
      { start: 1485, end: 1620 }
    ];

    // Chamada nativa da API do YouTube
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'zujWETunt7U',
        playerVars: {
          controls: 0,        // Oculta a barra de progresso
          disablekb: 1,       // Desabilita atalhos de teclado do YT
          modestbranding: 1,  // Remove logo do YT (dentro do possível)
          rel: 0,             // Não mostra vídeos relacionados no pause
          showinfo: 0,
          fs: 0               // Remove botão de fullscreen nativo
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      // Deixa o player pronto no ponto inicial, no mudo provisoriamente pra evitar falhas
      player.seekTo(segments[0].start);
      player.setVolume(100); 
    }

    // Botão de Play customizado
    document.getElementById('play-btn').addEventListener('click', () => {
      const wrapper = document.getElementById('video-wrapper');
      
      // Abre tela cheia nativamente pelo navegador
      if (wrapper.requestFullscreen) { wrapper.requestFullscreen(); }
      else if (wrapper.webkitRequestFullscreen) { wrapper.webkitRequestFullscreen(); } // Safari
      
      document.getElementById('start-screen').style.display = 'none';
      wrapper.style.display = 'block';
      
      player.playVideo();
    });

    function onPlayerStateChange(event) {
      // 1 = PLAYING. Cria o "espião" para checar o tempo a cada 100ms
      if (event.data === YT.PlayerState.PLAYING) {
        timeChecker = setInterval(checkTime, 100);
      } else {
        clearInterval(timeChecker);
      }
    }

    function checkTime() {
      if (currentSegment >= segments.length) return;

      const currentTime = player.getCurrentTime();
      const targetEnd = segments[currentSegment].end;

      // Se o tempo atual ultrapassou o limite final do segmento atual
      if (currentTime >= targetEnd) {
        currentSegment++;

        if (currentSegment < segments.length) {
          // Pula para o início do próximo segmento
          player.seekTo(segments[currentSegment].start, true);
        } else {
          // Fim de todos os segmentos
          clearInterval(timeChecker);
          player.stopVideo();
          showNextContent();
        }
      }
    }

    function showNextContent() {
      // Sai da tela cheia, se estiver
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
      
      // Esconde vídeo, mostra o placeholder
      document.getElementById('video-wrapper').style.display = 'none';
      document.getElementById('step-two').style.display = 'flex';
    }
  </script>
</body>
</html>
