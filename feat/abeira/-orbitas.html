<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>orbitas</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Helvetica:wght@100;300;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="https://umpedrogallego.github.io/site/feat/SashiMIDI_logo.ico">
    
    <style>
        :root {
            --bg: #0f0f0f;
            --ui-text: #bebab0;
            --accent: #f3ff54;
            --font-bg: 'Helvetica', sans-serif;
            --font-ui: 'JetBrains Mono', monospace;
        }

        body { margin: 0; overflow: hidden; background: var(--bg); font-family: var(--font-ui); color: var(--ui-text); }
        
        /* TELA DE SELEÇÃO */
        #selector-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 1000; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .selector-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            max-width: 800px; padding: 20px;
        }
        .word-card {
            border: 1px solid var(--ui-text); padding: 12px; cursor: pointer;
            text-align: center; font-size: 12px; text-transform: lowercase;
            transition: 0.2s;
        }
        .word-card.selected { background: var(--ui-text); color: var(--bg); }
        
        #start-btn {
            margin-top: 30px; padding: 15px 40px; background: transparent; 
            color: var(--ui-text); border: 1px solid var(--ui-text); 
            cursor: pointer; font-family: var(--font-ui); font-size: 18px;
            font-weight: 200;
         
        }
        #start-btn:hover { background: var(--ui-text); color: var(--bg); }

        canvas { display: block; }
        #status { position: fixed; bottom: 20px; left: 20px; font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>

<div id="selector-screen">
    <h1 style="letter-spacing: 2px; font-size: 18px; margin-bottom: 20px; font-weight: 200;">seleção de palavras</h1>
    <div class="selector-grid" id="grid"></div>
    <button id="start-btn">INÍCIO</button>
</div>

<div id="status">LexVox Sandbox // orbitas v1.0</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
/**
 * CONFIGURAÇÕES E WORD MAP (STRICT)
 */
const wordMap = {
    "dentro.mp3": "o dentro",
    "duplo.mp3": "o duplo",
    "corpo.mp3": "o corpo",
    "nome.mp3": "o nome",
    "ar.mp3": "o ar",
    "curva.mp3": "a curva",
    "vento.mp3": "o vento",
    "casa.mp3": "a casa",
    "fogo.mp3": "o fogo",
    "forma.mp3": "a forma",
    "pe.mp3": "o pé",
    "bolha.mp3": "a bolha",
    "dedo.mp3": "o dedo",
    "pai.mp3": "o pai"
};

const baseURL = "https://umpedrogallego.github.io/site/feat/abeira/";
let selectedFiles = [];
let audioCtx, masterGain, sounds = {};
let activeBackgrounds = [];
 
/**
 * PARÂMETROS DE ANIMAÇÃO (EDITE AQUI)
 */
const CONFIG = {
    bgDuration: 8000,      // Duração da palavra ao fundo (ms)
    startSpacing: 80,     // Espaçamento inicial entre letras (px)
    bgOpacity: 0.94,       // Opacidade máxima do fundo
    sphereRadius: 55,      // Raio das esferas flutuantes
    fontBg: "900 8em 'Helvetica'", // Fonte Barlow para o fundo
    fontUI: "bold 24px 'JetBrains Mono'"   // Fonte para esferas
};

// Gerar grid
// --- Gerar Seleção (Substitua ou adicione este bloco) ---
const grid = document.getElementById('grid');

// Cria o botão "TODAS"
const allBtn = document.createElement('div');
allBtn.className = 'word-card';
allBtn.style.color = 'var(--accent)'; // Cor de destaque para diferenciar
allBtn.style.fontWeight = '700';
allBtn.innerText = 'todas';

allBtn.onclick = () => {
    const cards = document.querySelectorAll('.word-card');
    const allKeys = Object.keys(wordMap);
    
    // Se nem todas estão selecionadas, seleciona tudo. Se já estão, limpa tudo.
    if (selectedFiles.length < allKeys.length) {
        selectedFiles = [...allKeys];
        cards.forEach(card => card.classList.add('selected'));
    } else {
        selectedFiles = [];
        cards.forEach(card => card.classList.remove('selected'));
    }
};
grid.appendChild(allBtn); // Adiciona o botão "todas" primeiro

// Mantém o loop original das palavras logo abaixo
Object.keys(wordMap).forEach(file => {
    const div = document.createElement('div');
    div.className = 'word-card';
    div.innerText = wordMap[file];
    div.onclick = () => {
        div.classList.toggle('selected');
        if(selectedFiles.includes(file)) {
            selectedFiles = selectedFiles.filter(f => f !== file);
        } else {
            selectedFiles.push(file);
        }
    };
    grid.appendChild(div);
});

async function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);

    const promises = selectedFiles.map(async file => {
        const response = await fetch(baseURL + file);
        const arrayBuffer = await response.arrayBuffer();
        const decoded = await audioCtx.decodeAudioData(arrayBuffer);
        sounds[wordMap[file]] = decoded;
    });
    await Promise.all(promises);
}

function playTrigger(name, x, y) {
    if (!sounds[name]) return;
    const source = audioCtx.createBufferSource();
    source.buffer = sounds[name];
    const panner = audioCtx.createPanner();
    panner.positionX.setValueAtTime((x / window.innerWidth) * 2 - 1, audioCtx.currentTime);
    source.connect(panner);
    panner.connect(masterGain);
    source.start(0);

    activeBackgrounds.push({ 
        text: name.toLowerCase(), 
        startTime: Date.now(),
        x: x,
        y: y
    });
}

document.getElementById('start-btn').onclick = async () => {
    if(selectedFiles.length === 0) return alert("selecione as palavras.");
    document.getElementById('start-btn').innerText = "carregando...";
    await initAudio();
    document.getElementById('selector-screen').style.display = 'none';
    startPhysics();
};

function startPhysics() {
    const { Engine, Render, Runner, Bodies, Composite, Body, Events, Mouse, MouseConstraint } = Matter;

    const engine = Engine.create();
    engine.gravity.y = 0;

    const render = Render.create({
        element: document.body,
        engine: engine,
        options: { 
            width: window.innerWidth, 
            height: window.innerHeight, 
            wireframes: false, 
            background: '#0f0f0f'
        }
    });

    const wallOpts = { isStatic: true, restitution: 1, friction: 0, render: { visible: false } };
    Composite.add(engine.world, [
        Bodies.rectangle(window.innerWidth/2, -25, window.innerWidth, 50, wallOpts),
        Bodies.rectangle(window.innerWidth/2, window.innerHeight+25, window.innerWidth, 50, wallOpts),
        Bodies.rectangle(-25, window.innerHeight/2, 50, window.innerHeight, wallOpts),
        Bodies.rectangle(window.innerWidth+25, window.innerHeight/2, 50, window.innerHeight, wallOpts)
    ]);

    const wordBodies = selectedFiles.map(file => {
        const b = Bodies.circle(Math.random()*window.innerWidth, Math.random()*window.innerHeight, CONFIG.sphereRadius, {
            restitution: 1, frictionAir: 0, label: wordMap[file],
            render: { fillStyle: '#0f0f0f', strokeStyle: '#0f0f0f', lineWidth: 0 }
        });
        Body.setVelocity(b, { x: (Math.random()-0.5)*8, y: (Math.random()-0.5)*8 });
        return b;
    });
    Composite.add(engine.world, wordBodies);

Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach(pair => {
            const receiver = (pair.bodyA.speed < pair.bodyB.speed) ? pair.bodyA : pair.bodyB;
            // Identifica o ponto exato da colisão para o fundo
            const impact = pair.collision.supports[0] || receiver.position;
            if(sounds[receiver.label]) playTrigger(receiver.label, impact.x, impact.y);
        });
    });

    Events.on(render, 'afterRender', () => {
        const ctx = render.context;
        const now = Date.now();

        // 1. ANIMAÇÃO COLAPSIVA (BARLOW)
activeBackgrounds.forEach(bg => {
            const elapsed = now - bg.startTime;
            const progress = elapsed / CONFIG.bgDuration;
            
            ctx.save();
            const currentSpacing = CONFIG.startSpacing * (1 - progress);
            
            ctx.font = CONFIG.fontBg;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = `rgba(186, 186, 176, ${CONFIG.bgOpacity * (1 - progress)})`;

            const chars = bg.text.split('');
            const totalWidth = (chars.length - 1) * currentSpacing;
            
            // --- INÍCIO DA LÓGICA DE CONTENÇÃO ---
            // Extrai o tamanho da fonte (ex: 8.4) e converte para pixels aproximados (base 16px)
            const fontSizeEm = parseFloat(CONFIG.fontBg.split(' ')[1]);
            const fontSizePx = fontSizeEm * 16; 

            const halfWidth = totalWidth / 2;
            const halfHeight = fontSizePx / 2;

            // Ajusta o X para que a metade da largura da palavra nunca ultrapasse as bordas
            let safeX = Math.max(halfWidth, Math.min(window.innerWidth - halfWidth, bg.x));
            
            // Ajusta o Y para que a metade da altura da fonte nunca ultrapasse o topo ou o fundo
            let safeY = Math.max(halfHeight, Math.min(window.innerHeight - halfHeight, bg.y));

            let startX = safeX - halfWidth;
            // --- FIM DA LÓGICA DE CONTENÇÃO ---

            chars.forEach((char, i) => {
                // Desenha usando safeX e safeY ajustados
                ctx.fillText(char, startX + (i * currentSpacing), safeY);
            });
            ctx.restore();
        });

        // 2. ESFERAS (JETBRAINS)
        wordBodies.forEach(b => {
            const { x, y } = b.position;
            ctx.save();
            ctx.translate(x, y);
            ctx.font = CONFIG.fontUI;
            ctx.fillStyle = "#bebab0";
            ctx.textAlign = "center"; 
            ctx.fillText(b.label.toLowerCase(), 0, 5);
            ctx.restore();
        });
    });

    const mouse = Mouse.create(render.canvas);
    Composite.add(engine.world, MouseConstraint.create(engine, { 
        mouse: mouse, 
        constraint: { stiffness: 0.2, render: { visible: false } } 
    }));

    Render.run(render);
    Runner.run(Runner.create(), engine);
}
</script>
</body>
</html>
