<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Gallego</title>
    <link href="https://api.fontshare.com/v2/css?f[]=supreme@100,200,300,400,500,700,800&display=swap" rel="stylesheet">

    <style>
        :root {
            --texto-escuro: #182420;
            --texto-claro: #bbb2ad;
            --fundo-claro: #bbb2ad;
            --fundo-medio: #91837a;
            --texto-sem-selecao: #605b54;
            --fundo-cabecalho: #182420;
            
            --font-site: 'Supreme', sans-serif;
            --header-height: 50px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: var(--font-site); 
            background-color: var(--fundo-medio); 
            color: var(--texto-escuro); 
            overflow-x: hidden;
            font-weight: 400;
            padding-top: var(--header-height); /* Compensa o header fixed */
        }

        a { color: inherit; font-weight: bold; text-decoration: underline; }
        a:hover { text-decoration: none; }

        .container-94 { width: 94vw; margin: 0 auto; }
        .container-88 { width: 88vw; margin: 0 auto; }

        /* CABEÇALHO PRINCIPAL (FIXED) */
        header {
            background-color: var(--fundo-cabecalho);
            color: var(--texto-claro);
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3vw;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        
        body.header-hidden header {
            transform: translateY(-100%);
        }

        header h1 { font-size: 20px; font-weight: 700; text-transform: uppercase; }
        .header-icons { display: flex; gap: 15px; align-items: center; }
        .header-icons svg { cursor: pointer; }

        /* ACORDEÕES GERAIS */
        .accordion-header {
            background-color: var(--fundo-medio);
            color: var(--texto-escuro);
            padding: 15px 3vw;
            border-bottom: 1px solid var(--texto-sem-selecao);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            cursor: pointer;
            font-weight: 500;
        }
        
        .arrow { display: flex; align-items: center; transition: transform 0.3s ease; }

        .accordion-content {
            background-color: var(--fundo-claro);
            display: none;
            width: 100%;
            font-weight: 400;
        }
        .accordion-content.active { display: block; }

        .trabalhos-content { background-color: var(--fundo-claro); padding-bottom: 50px; }

        /* SUB-CABEÇALHO DA OBRA (STICKY) */
        #obra-atual-header {
            background-color: var(--fundo-medio);
            border-bottom: 1px solid var(--texto-sem-selecao);
            padding: 10px 3vw;
            position: sticky;
            top: var(--header-height);
            z-index: 90;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 400;
            transition: top 0.3s ease;
        }
        
        body.header-hidden #obra-atual-header {
            top: 0;
        }

        /* MENU DROPDOWN DE OBRAS */
        #dropdown-obras {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 70vh;
            background-color: var(--fundo-medio);
            overflow-y: auto;
            overscroll-behavior: contain;
            border-top: 1px solid rgba(24, 36, 32, 0.2); 
            border-bottom: 1px solid var(--texto-escuro);
            z-index: 95;
            font-weight: 400;
        }
        
        #dropdown-obras::-webkit-scrollbar { width: 6px; }
        #dropdown-obras::-webkit-scrollbar-track { background: transparent; }
        #dropdown-obras::-webkit-scrollbar-thumb { background-color: var(--fundo-cabecalho); border-radius: 4px; }

        .dropdown-item {
            padding: 12px 3vw;
            border-bottom: 1px solid rgba(24, 36, 32, 0.2);
            cursor: pointer;
        }
        .dropdown-item:hover { background-color: var(--fundo-claro); }

        /* GALERIA DE FEED */
        .galeria-scroll { display: flex; flex-direction: column; gap: 40px; padding: 40px 0; }
        
        .item-obra-container { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            position: relative; 
            transition: margin 0.3s ease;
        }
        .item-obra-container:nth-child(odd) { align-items: flex-start; }
        .item-obra-container:nth-child(even) { align-items: flex-end; }
        
        /* Respiro ao redor da galeria expandida */
        .item-obra-container.expanded { 
            align-items: flex-start !important; 
            margin-top: 10vh;
            margin-bottom: 10vh;
        }

        /* PADRONIZAÇÃO DE IMAGENS (Feed e Galeria) */
        .img-obra, .galeria-item {
            height: 60vh;
            width: auto;
            max-width: 80vw;
            display: block;
            object-fit: contain;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* VISUALIZAÇÃO DA GALERIA (EXPANDIDA) */
        .galeria-wrapper {
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-left: 3vw;
            padding-bottom: 15px; 
            scroll-behavior: smooth;
            position: relative;
        }
        
        .galeria-wrapper::after {
            content: "";
            flex: 0 0 6vw; 
        }

        .galeria-wrapper::-webkit-scrollbar { height: 6px; }
        .galeria-wrapper::-webkit-scrollbar-track { background: transparent; }
        .galeria-wrapper::-webkit-scrollbar-thumb { background-color: var(--fundo-cabecalho); border-radius: 4px; }

        /* FICHA TÉCNICA */
        .ficha-tecnica { 
            margin-top: 10px; 
            font-weight: 400; 
            line-height: 1.4; 
            color: var(--texto-escuro); 
            width: 88vw; 
            margin-left: auto; 
            margin-right: auto; 
        }
        .ficha-tecnica b { font-weight: 500; }
        .ficha-primary { font-size: 1.1rem; margin-bottom: 5px; }
        .ficha-secondary { margin-bottom: 15px; color: var(--texto-escuro); }

        /* LIGHTBOX */
        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        
        .lb-top-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 50px;
            z-index: 10001;
        }
        
        .lb-nav-btn {
            font-size: 30px;
            color: white;
            cursor: pointer;
            user-select: none;
            opacity: 0.7;
            font-family: monospace; 
        }
        .lb-nav-btn:hover { opacity: 1; }

        #lightbox-media-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .lightbox-media {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
        }

        /* SEÇÃO EM EXPOSIÇÃO */
        #expo-section { display: none; }
        #expo-dates { font-weight: 400; }
        .expo-info { padding: 20px 0; font-weight: 400; line-height: 1.4; }
        .expo-hero-img { width: 100%; height: auto; display: block; }
        .expo-flex { display: flex; flex-direction: column; }
        .expo-intro { font-size: 1.4rem; font-weight: 700; margin-bottom: 15px; line-height: 1.2; }
        .expo-texto-body { font-size: 1rem; font-weight: 400; }

        /* MODO DESKTOP */
        @media (min-width: 768px) {
            .img-obra, .galeria-item { max-width: 70vw; } /* Ajuste de largura no Desktop */
            
            .ficha-tecnica {
                width: auto;
                margin-left: 6vw;
                margin-right: 24vw;
            }

            .expo-flex {
                flex-direction: row;
                align-items: center; 
                width: 94vw; margin: 0 auto; gap: 40px; padding: 40px 0;
            }
            #expo-media, #expo-texto-container { width: 50%; margin: 0; padding: 0 !important; }
            .expo-hero-img { max-height: 60vh; width: auto; max-width: 100%; }
            #expo-texto-container { display: flex; justify-content: flex-start; }
            .expo-texto-inner { width: 70%; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <h1>Pedro Gallego</h1>
        <div class="header-icons">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </div>
    </header>

    <div id="expo-section">
        <div class="accordion-header" onclick="toggleAccordion(this, 'expo-content')">
            <span>EM EXPOSIÇÃO</span>
            <span id="expo-dates">--.-- — --.--</span>
        </div>
        <div id="expo-content" class="accordion-content active">
            <div class="expo-flex">
                <div class="container-94" id="expo-media"></div>
                <div id="expo-texto-container">
                    <div class="expo-info expo-texto-inner container-88" id="expo-texto"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="accordion-header" onclick="toggleAccordion(this, 'trabalhos-conteudo')">
        <span>TRABALHOS</span>
        <span class="arrow" style="transform: rotate(180deg);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </span>
    </div>
    
    <div id="trabalhos-conteudo" class="accordion-content active">
        <div id="obra-atual-header" onclick="toggleDropdown()">
            <span id="titulo-obra-visivel">Carregando...</span>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="btn-close-header" style="display: none; font-weight: bold; cursor: pointer; font-size: 18px;" onclick="fecharGaleria(event)">X</span>
                <span class="arrow-dropdown" style="transition: transform 0.3s ease; display: flex;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </span>
            </div>
            <div id="dropdown-obras"></div>
        </div>

        <div class="trabalhos-content container-94">
            <div class="galeria-scroll" id="galeria-feed"></div>
        </div>
    </div>

    <!-- LIGHTBOX HTML -->
    <div id="lightbox" onclick="fecharLightbox(event)">
        <div class="lb-top-bar">
            <span class="lb-nav-btn" onclick="navLightbox(-1, event)">&lt;</span>
            <span class="lb-nav-btn" onclick="fecharLightbox(event)" style="font-family: var(--font-site); font-size: 24px; margin-top: 2px;">X</span>
            <span class="lb-nav-btn" onclick="navLightbox(1, event)">&gt;</span>
        </div>
        <div id="lightbox-media-container" onclick="event.stopPropagation()"></div>
    </div>

    <!-- OUTROS ACORDEÕES... -->
    <div class="accordion-header" onclick="toggleAccordion(this, 'projetos-conteudo')">
        <span>PROJETOS</span>
        <span class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
    </div>
    <div id="projetos-conteudo" class="accordion-content"></div>

    <div class="accordion-header" onclick="toggleAccordion(this, 'indice-conteudo')">
        <span>ÍNDICE GERAL</span>
        <span class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
    </div>
    <div id="indice-conteudo" class="accordion-content"></div>

    <div class="accordion-header" onclick="toggleAccordion(this, 'cv-conteudo')">
        <span>CV</span>
        <span class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
    </div>
    <div id="cv-conteudo" class="accordion-content"></div>

    <div class="accordion-header" onclick="toggleAccordion(this, 'contato-conteudo')">
        <span>CONTATO</span>
        <span class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
    </div>
    <div id="contato-conteudo" class="accordion-content"></div>

    <script>
        const URL_TRABALHOS = "https://umpedrogallego.github.io/site/json/trabalhos.json";
        const URL_CV = "https://umpedrogallego.github.io/site/json/cv.json";
        const WEBP_BASE = "https://umpedrogallego.github.io/site/img/webp/";
        const MIDIA_BASE = "https://umpedrogallego.github.io/site/midia/";
        const PLAYER_BASE = "https://umpedrogallego.github.io/site/player/";

        let listaObras = [];
        let idObraVisivel = null;
        let lbElements = [];
        let lbCurrentIndex = 0;
        let lastScrollY = window.scrollY;

        async function init() {
            await checarExposicao();
            await carregarTrabalhos();
            configurarScroll();
        }

        async function checarExposicao() {
            try {
                const res = await fetch(URL_CV);
                const cvData = await res.json();
                
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);
                
                const expoAtiva = cvData.find(item => {
                    if(!item.FIM) return false;
                    const dataFim = new Date(item.FIM);
                    return hoje <= dataFim;
                });

                if (expoAtiva) {
                    document.getElementById('expo-section').style.display = 'block';
                    document.getElementById('expo-media').innerHTML = `<img class="expo-hero-img" src="https://www.sescsp.org.br/wp-content/uploads/2025/11/Banner-o-mundo-atraves-da-IA-1-e1763745840758.png" alt="Banner da Exposição">`;
                    
                    const introFormatada = expoAtiva.INTRO ? expoAtiva.INTRO.replace(/\n/g, '<br>') : '';
                    const textoFormatado = expoAtiva.TEXTO ? expoAtiva.TEXTO.replace(/\n/g, '<br>') : '';
                    document.getElementById('expo-texto').innerHTML = `<div class="expo-intro">${introFormatada}</div><div class="expo-texto-body">${textoFormatado}</div>`;
                    
                    const formatarData = (d) => {
                        const dateObj = new Date(d);
                        return `${String(dateObj.getDate()).padStart(2, '0')}.${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
                    };
                    document.getElementById('expo-dates').innerText = `${formatarData(expoAtiva.INICIO)} — ${formatarData(expoAtiva.FIM)}`;
                }
            } catch(e) { console.error("Erro ao carregar CV:", e); }
        }

        function renderizarMiniatura(obra) {
            if (obra.MIDIA && obra.MIDIA.trim() !== "") {
                return `<video class="img-obra" muted loop playsinline autoplay onclick="abrirObra('${obra.ID}', event)">
                            <source src="${MIDIA_BASE}${obra.ID}a.${obra.MIDIA}" type="video/mp4">
                        </video>`;
            } else {
                return `<img class="img-obra" src="${WEBP_BASE}${obra.ID}a.webp" alt="${obra.TITULO}" loading="lazy" onerror="this.style.display='none'" onclick="abrirObra('${obra.ID}', event)">`;
            }
        }

        async function carregarTrabalhos() {
            try {
                const res = await fetch(URL_TRABALHOS);
                const data = await res.json();
                
                listaObras = data.filter(w => w.DESTAQUE !== 'N' && w.INCLUIR !== "");
                const galeriaFeed = document.getElementById('galeria-feed');
                let htmlFeed = '';

                listaObras.forEach((obra) => {
                    htmlFeed += `
                        <div class="item-obra-container" id="obra-${obra.ID}" data-titulo="${obra.TITULO}">
                            ${renderizarMiniatura(obra)}
                        </div>
                    `;
                });

                galeriaFeed.innerHTML = htmlFeed;
                if (listaObras.length > 0) atualizarTituloEDropdown(listaObras[0].ID, listaObras[0].TITULO);

            } catch (e) { console.error("Erro ao carregar Trabalhos:", e); }
        }

        function buildGalleryHTML(obra) {
            let mediaHtml = '';
            
            if (obra.PLAYER && obra.PLAYER.trim() !== "") {
                mediaHtml += `<video class="galeria-item lb-item" src="${PLAYER_BASE}${obra.ID}play.mp4" controls onclick="abrirLightbox(this, event)"></video>`;
            }

            const count = parseInt(obra.IMG_COUNT) || 1;
            const letras = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j'];
            const isMidiaVideo = (obra.MIDIA && obra.MIDIA.length > 2);
            
            for (let j = 0; j < count; j++) {
                if (j === 0 && isMidiaVideo) {
                    mediaHtml += `<video class="galeria-item lb-item" muted loop playsinline autoplay onclick="abrirLightbox(this, event)"><source src="${MIDIA_BASE}${obra.ID}a.${obra.MIDIA}" type="video/mp4"></video>`;
                } else {
                    const letra = letras[j] || 'a';
                    mediaHtml += `<img class="galeria-item lb-item" src="${WEBP_BASE}${obra.ID}${letra}.webp" loading="lazy" onclick="abrirLightbox(this, event)">`;
                }
            }
            
            const sobre = obra.SOBRE ? obra.SOBRE.replace(/\n/g, '<br>') : '';
            return `
                <div class="galeria-wrapper">${mediaHtml}</div>
                <div class="ficha-tecnica">
                    <div class="ficha-primary"><b>${obra.TITULO || ''}</b>, ${obra.ANO || ''}</div>
                    <div class="ficha-secondary">${obra.TECNICA || ''}, ${obra.DIMENSAO || ''}</div>
                    <div class="ficha-sobre">${sobre}</div>
                </div>
            `;
        }

        function abrirObra(id, event) {
            if (event) event.stopPropagation();
            fecharGaleria(); 
            
            const container = document.getElementById(`obra-${id}`);
            const obra = listaObras.find(o => o.ID === id);
            
            container.classList.add('expanded');
            container.innerHTML = buildGalleryHTML(obra);
            
            document.getElementById('btn-close-header').style.display = 'block';
            
            setTimeout(() => {
                const headerOffset = document.body.classList.contains('header-hidden') ? 50 : 100;
                const y = container.getBoundingClientRect().top + window.scrollY - headerOffset;
                window.scrollTo({top: y, behavior: 'smooth'});
            }, 50);

            atualizarTituloEDropdown(id, obra.TITULO);
            document.getElementById('dropdown-obras').style.display = 'none';
            const arrowDropdown = document.querySelector('.arrow-dropdown');
            if(arrowDropdown) arrowDropdown.style.transform = 'rotate(0deg)';
        }

        function fecharGaleria(event) {
            if(event) event.stopPropagation();
            document.querySelectorAll('.item-obra-container.expanded').forEach(el => {
                const id = el.id.replace('obra-', '');
                const obra = listaObras.find(o => o.ID === id);
                el.classList.remove('expanded');
                el.innerHTML = renderizarMiniatura(obra);
            });
            const btnClose = document.getElementById('btn-close-header');
            if(btnClose) btnClose.style.display = 'none';
        }

        // LIGHTBOX LOGIC
        function abrirLightbox(element, event) {
            event.stopPropagation();
            const galeria = element.closest('.galeria-wrapper');
            lbElements = Array.from(galeria.querySelectorAll('.lb-item'));
            lbCurrentIndex = lbElements.indexOf(element);
            
            document.getElementById('lightbox').style.display = 'flex';
            atualizarLightbox();
        }

        function atualizarLightbox() {
            const container = document.getElementById('lightbox-media-container');
            const el = lbElements[lbCurrentIndex];
            
            if (el.tagName === 'VIDEO') {
                container.innerHTML = `<video class="lightbox-media" src="${el.querySelector('source') ? el.querySelector('source').src : el.src}" controls autoplay></video>`;
            } else {
                container.innerHTML = `<img class="lightbox-media" src="${el.src}">`;
            }
        }

        function navLightbox(dir, event) {
            if(event) event.stopPropagation();
            lbCurrentIndex += dir;
            if (lbCurrentIndex < 0) lbCurrentIndex = lbElements.length - 1;
            if (lbCurrentIndex >= lbElements.length) lbCurrentIndex = 0;
            atualizarLightbox();
        }

        function fecharLightbox(event) {
            if(event) event.stopPropagation();
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-media-container').innerHTML = '';
        }

        function atualizarTituloEDropdown(idAtivo, titulo) {
            if (idObraVisivel === idAtivo) return;
            idObraVisivel = idAtivo;
            document.getElementById('titulo-obra-visivel').innerText = titulo;
            const dropdown = document.getElementById('dropdown-obras');
            let htmlDropdown = '';
            listaObras.forEach(obra => {
                if (obra.ID !== idAtivo) {
                    htmlDropdown += `<div class="dropdown-item" onclick="abrirObra('${obra.ID}', event)">${obra.TITULO}</div>`;
                }
            });
            dropdown.innerHTML = htmlDropdown;
        }

        function configurarScroll() {
            window.addEventListener('scroll', () => {
                const currentScrollY = window.scrollY;
                
                // Lógica para esconder o cabeçalho principal
                if (currentScrollY > lastScrollY && currentScrollY > 50) {
                    document.body.classList.add('header-hidden');
                } else if (currentScrollY < lastScrollY) {
                    document.body.classList.remove('header-hidden');
                }
                lastScrollY = currentScrollY;

                // Lógica de atualização do título da obra
                const containers = document.querySelectorAll('.item-obra-container');
                let obraCentral = null;
                const offsetCabecalho = 90;

                for (let container of containers) {
                    const rect = container.getBoundingClientRect();
                    if (rect.bottom > (rect.height * 0.24) + offsetCabecalho) {
                        obraCentral = container;
                        break;
                    }
                }

                if (obraCentral) {
                    const id = obraCentral.id.replace('obra-', '');
                    const titulo = obraCentral.getAttribute('data-titulo');
                    atualizarTituloEDropdown(id, titulo);
                }
            });
        }

        function toggleAccordion(headerElement, contentId) {
            const content = document.getElementById(contentId);
            if (!content) return;
            const isActive = content.classList.contains('active');
            if (isActive) content.classList.remove('active');
            else content.classList.add('active');
            
            const arrow = headerElement.querySelector('.arrow');
            if (arrow) arrow.style.transform = isActive ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('dropdown-obras');
            const arrowDropdown = document.querySelector('.arrow-dropdown');
            if (dropdown.style.display === 'block') {
                dropdown.style.display = 'none';
                arrowDropdown.style.transform = 'rotate(0deg)';
            } else {
                dropdown.style.display = 'block';
                arrowDropdown.style.transform = 'rotate(180deg)';
            }
        }

        // EVENTOS DE TECLADO
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').style.display === 'flex') {
                if (e.key === "Escape") fecharLightbox();
                if (e.key === "ArrowLeft") navLightbox(-1, e);
                if (e.key === "ArrowRight") navLightbox(1, e);
            } else if (e.key === "Escape") {
                fecharGaleria();
            }
        });

        // NAVEGAÇÃO DO LIGHTBOX POR SCROLL
        let wheelTimeout;
        document.getElementById('lightbox').addEventListener('wheel', (e) => {
            if (wheelTimeout) return;
            if (e.deltaX > 20 || e.deltaY > 20) { 
                navLightbox(1, e); 
                wheelTimeout = setTimeout(() => wheelTimeout = null, 300);
            } else if (e.deltaX < -20 || e.deltaY < -20) { 
                navLightbox(-1, e); 
                wheelTimeout = setTimeout(() => wheelTimeout = null, 300);
            }
        });

        window.addEventListener('click', (e) => {
            const headerObra = document.getElementById('obra-atual-header');
            if (headerObra && !headerObra.contains(e.target)) {
                document.getElementById('dropdown-obras').style.display = 'none';
                const arrowDropdown = document.querySelector('.arrow-dropdown');
                if(arrowDropdown) arrowDropdown.style.transform = 'rotate(0deg)';
            }

            if (!e.target.closest('.expanded') && !e.target.classList.contains('img-obra') && !e.target.closest('#lightbox')) {
                fecharGaleria();
            }
        });

        init();
    </script>
</body>
</html>
